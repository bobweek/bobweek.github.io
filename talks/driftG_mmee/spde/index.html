<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPDE density — mutation, selection, drift</title>
  <style>
    /* ---- the minimal window ---- */
    #sim {
      position: relative;        /* controls inside are positioned relative to this box */
      width: 960px;              /* must match createCanvas(cw, ch) in sketch.js */
      height: 540px;
      margin: 1rem auto;         /* centered; change/remove to place it elsewhere */
      background: #ffffff;
      overflow: hidden;          /* clip the control panel to the window */
      border: 1px solid #d5dde6;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,.10);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #sim canvas { display: block; }

    /* compact light-theme controls inside the window */
    #sim .chk {
      display: inline-flex; align-items: center; gap: 5px;
      font: 600 13.5px ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    #sim .chk input { margin: 0; cursor: pointer; width: 14px; height: 14px; }
    #sim .chk label { cursor: pointer; }
    #sim button {
      background: #f4f6f9; color: #1b1f24; border: 1px solid #c3ccd6;
      border-radius: 5px; line-height: 20px; cursor: pointer;
      font: 12px ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding: 1px 9px;
    }
    #sim button:hover { background: #e8edf3; }

    /* neutral backdrop; delete when embedding into your own layout */
    body { margin: 0; background: #f6f8fb; }
  </style>
</head>
<body>
  <!-- the simulation renders entirely inside this box -->
  <div id="sim"></div>

  <!-- p5.js engine, pinned to the 1.x line (this sketch uses 1.x global-mode APIs) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>

  <!-- the sketch -->
  <script src="sketch.js"></script>
</body>
</html>
